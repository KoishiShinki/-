server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: chronicle-studio
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chronicle?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:chronicle}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: ${DB_INIT:always}
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    time-zone: UTC
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: io.chronicle.timeline.domain
  configuration:
    map-underscore-to-camel-case: true
pagehelper:
  helper-dialect: mysql
  reasonable: true
chronicle:
  app-origin: ${APP_ORIGIN:http://localhost:5173}
  storage-root: ${STORAGE_ROOT:./data/uploads}
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  secure-cookie: ${SECURE_COOKIE:false}
timeline:
  ai:
    enabled: ${AI_ENABLED:false}
    siliconflow:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      text-model: ${TEXT_MODEL:deepseek-ai/DeepSeek-V3.2}
      vision-model: ${VISION_MODEL:Qwen/Qwen3-VL-32B-Thinking}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      image-model: ${IMAGE_MODEL:gpt-image-1}
