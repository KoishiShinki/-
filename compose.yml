services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_cs"]
    environment:
      MYSQL_DATABASE: chronicle
      MYSQL_USER: chronicle
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, --silent]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/chronicle?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: chronicle
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_ROOT: /app/data/uploads
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      TEXT_MODEL: ${TEXT_MODEL:-deepseek-ai/DeepSeek-V3.2}
      VISION_MODEL: ${VISION_MODEL:-Qwen/Qwen3-VL-32B-Thinking}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-1}
    volumes:
      - media:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  database:
  media:
